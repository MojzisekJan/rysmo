[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["Jan Mojzisek <mojzisekjan@gmail.com>"]
repository = "https://github.com/MojzisekJan/rysmo"
rust-version = "1.97.1"

[workspace.dependencies]
glam = { version = "0.33.2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
base64 = "0.23"
png = "0.18"
rysmo_math = { path = "crates/rysmo_math" }
rysmo_mesh = { path = "crates/rysmo_mesh" }
rysmo_model = { path = "crates/rysmo_model" }
rysmo_infer = { path = "crates/rysmo_infer" }
rysmo_tools = { path = "crates/rysmo_tools" }
rysmo_io = { path = "crates/rysmo_io" }
rysmo_mcp = { path = "crates/rysmo_mcp" }
rysmo_library = { path = "crates/rysmo_library" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "warn"
unimplemented = "warn"

# Bevy is slow in debug; optimise dependencies but keep our own crates quick to build.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"

# The web build (crates/rysmo_app/index.html picks it): smallest code, whole-program
# optimisation. Slow to build; only trunk uses it.
[profile.web-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1

# Cross-platform smoke builds avoid multi-gigabyte debug symbols and incremental data.
[profile.portable]
inherits = "dev"
debug = 0
incremental = false
opt-level = 1

[profile.portable.package."*"]
opt-level = 1
