[package]
name = "rysmo_app"
description = "Rysmo desktop and mobile application: Bevy viewport, egui panels"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "rysmo"
path = "src/main.rs"

[features]
# Faster incremental builds on desktop: `cargo run --features dev`.
dev = ["bevy/dynamic_linking"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
# Keep web renderer features explicit: the 3d bundle also adds unused glTF,
# animation, Bevy text, and automatic reflection registration. Native targets
# retain their existing feature bundle below. (Bevy's derive macros look for
# `bevy` among the plain dependencies, so it has to be listed here.)
bevy = { version = "0.20.0", default-features = false, features = [
    "async_executor", "bevy_asset", "bevy_log", "std", "bevy_winit", "bevy_clipboard", "custom_cursor",
    "bevy_render", "bevy_core_pipeline", "bevy_gizmos_render", "bevy_anti_alias", "bevy_pbr", "bevy_post_process", "tonemapping_luts", "ktx2", "zstd_rust", "keyboard", "mouse", "touch", "gestures", "png", "jpeg",
] }
bevy_egui = { version = "0.43.1", default-features = false, features = ["render", "default_fonts"] }
egui-phosphor = "0.14.0"
image = { version = "0.25.10", default-features = false }
png.workspace = true
rysmo_math.workspace = true
rysmo_mesh.workspace = true
rysmo_model.workspace = true
rysmo_infer.workspace = true
rysmo_tools.workspace = true
rysmo_io.workspace = true
rysmo_library.workspace = true

[target.'cfg(not(any(target_arch = "wasm32", target_os = "android", target_os = "ios")))'.dependencies]
# default_platform without bevy_gilrs: gamepads need libudev and are not used.
bevy = { version = "0.20.0", default-features = false, features = ["multi_threaded", "default_app", "3d_bevy_render", "default_font"] }
rfd = "0.17.2"
winit = { version = "0.30.13", default-features = false }
rysmo_mcp.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
bevy = { version = "0.20.0", default-features = false, features = ["x11", "wayland"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies.bevy_egui]
version = "0.43.1"
default-features = false
features = ["manage_clipboard"]

# macOS: controls drawn in the AppKit manner, the system font and accent colour.
[target.'cfg(target_os = "macos")'.dependencies]
egui_native_look = { git = "https://github.com/MojzisekJan/egui_native_look" }

[target.'cfg(target_os = "android")'.dependencies]
bevy = { version = "0.20.0", default-features = false, features = ["multi_threaded", "android-native-activity", "default_app", "3d_bevy_render", "default_font"] }

[target.'cfg(target_os = "ios")'.dependencies]
bevy = { version = "0.20.0", default-features = false, features = ["multi_threaded", "default_app", "3d_bevy_render", "default_font"] }

# The browser: WebGL2, which every browser has; see docs/web.md.
[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { version = "0.20.0", default-features = false, features = ["web", "webgl2"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window", "Document", "Element", "HtmlElement", "HtmlInputElement", "HtmlAnchorElement", "FileList", "File",
    "Blob", "BlobPropertyBag", "Url", "Location", "UrlSearchParams", "Event", "CustomEvent", "CustomEventInit",
] }
wasm-bindgen-futures = "0.4"
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }

[lints]
workspace = true
